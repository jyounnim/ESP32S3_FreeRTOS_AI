; PlatformIO Project Configuration File
; 00_LITERT_TFLM_SETUP — ESP-IDF framework environment check for TFLM on ESP32-S3
;
; This project intentionally starts with no source file in src/.
; Step 4 of the KR doc copies the hello_world example from the
; downloaded esp-tflite-micro component into src/ to verify the toolchain.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
